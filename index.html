<!-- Add Pokemon Offcanvas   -->
<div class="offcanvas offcanvas-end " tabindex="-1" id="addPokemonOffcanvas">
    <div class="offcanvas-header bg-primary text-center text-white">

        <i type="button" class="bi bi-arrow-return-left text-white fs-5" data-bs-toggle="offcanvas"
           data-bs-target="#editTeamOffCanvas"></i>
        <button type="button" class="btn-close" data-bs-toggle="offcanvas"
                aria-label="back"></button>
    </div>
    <div class="">
        <div class="p-3 border-bottom">
            <label class="form-label w-100">Search Pokemon
                <input class="form-control " placeholder="'Enter' to Search" id="pokemonSelect">

            </label>
        </div>
        <div id="renderList">

        </div>
    </div>


</div>
<!-- add pokemon offcanvas end -->
<!-- added pokemon details offcanvas -->
<div class="offcanvas offcanvas-end d-flex flex-column bg-light  " tabindex="-1" id="addPokemonDetailsOffCanvas">
    <div class="offcanvas-header bg-primary text-center text-white">
        <i type="button" class="bi bi-arrow-return-left text-white fs-5" data-bs-toggle="offcanvas"
           data-bs-target="#addPokemonOffcanvas"></i>
        <button type="button" class="btn-close" data-bs-toggle="offcanvas"
                aria-label="back"></button>
    </div>
    <div class="flex-grow-1 d-flex flex-column">
        <div class="px-4">
            <div class="px-5 pt-3">
                <img src="" class="bg-white img-fluid details-img w-100 border border-dark-subtle rounded" alt="">
            </div>
        </div>
        <div class="text-center">
            <p class="fs-4 fw-medium mt-2 details-name text-capitalize"></p>
        </div>
        <form class="container-fluid d-flex flex-column flex-grow-1">
            <!-- cp button div -->
            <div class="row g-2 btn-group" role="group" aria-label="Pokemon Creature Power Buttons">
                <div class="col-6">
                    <input type="radio" class="btn-check " id="tierOneCP" name="btnradio" autocomplete="off">
                    <label class="btn btn-outline-primary w-100 " for="tierOneCP">0-1500CP</label>

                </div>
                <div class="col-6">
                    <input type="radio" class="btn-check" id="tierTwoCP" name="btnradio" autocomplete="off">
                    <label class="btn btn-outline-primary w-100" for="tierTwoCP">2500+CP</label>

                </div>
                <div class="col-6">
                    <input type="radio" class="btn-check" id="tierThreeCP" name="btnradio" autocomplete="off">
                    <label class="btn btn-outline-primary w-100" for="tierThreeCP">2500+</label>

                </div>
                <div class="col-6">
                    <input type="radio" class="btn-check" id="tierFourCP" name="btnradio" autocomplete="off">
                    <label class="btn btn-outline-primary w-100" for="tierFourCP">3500+CP</label>

                </div>
            </div>
            <!-- end -->
            <!-- toggle options -->
            <div class="row g-2 m-2">
                <div class="">
                    <label class="form-check-label">

                        <input type="checkbox" id="isShadow" class="border-dark-subtle form-check-input">
                        Shadow
                    </label>

                </div>
                <div class="">
                    <label class="form-check-label">

                        <input type="checkbox" id="isMega" class="border-dark-subtle form-check-input">
                        Mega Evolved
                    </label>
                </div>
            </div>
            <!-- end -->
            <!-- submit button -->
            <div class="row g-2 mt-auto">
                <div class="col-12">
                    <button type="button" data-bs-toggle="modal" data-bs-target="#pokemonAddedSuccess" href="#"
                            class="btn btn-primary mb-2 py-2 fs-4 w-100">Add Pokemon
                    </button>
                </div>
            </div>
            <!-- end -->
        </form>
    </div>
</div>
<!-- added pokemon details offcanvas end -->
<!-- success added pokemon modal -->
<div class="modal fade" tabindex="-1" id="pokemonAddedSuccess">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header p-3">
                <h1 class="modal-title fs-5 text-center mx-auto" id="pokemonAddedSuccessTitle">Pokemon Added</h1>
                <!-- <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button> -->
            </div>
            <div class="modal-body">
                <!-- img -->
                <div class="row justify-content-center">
                    <div class="col-10">
                        <img class="img-fluid w-100 border rounded"
                             src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/351.png"
                             alt="">
                    </div>
                </div>
                <!-- RP text -->
                <div class="text-center">
                    <p class="text-uppercase fw-bold text-tertiary fs-6 mt-2 mb-1">Raid Power</p>
                    <p class="fw-bolder fs-3 text-dark mb-0">318</p>
                </div>

            </div>
            <div class="modal-footer p-2">
                <button type="button" class="btn btn-primary w-100" data-bs-dismiss="modal"
                        data-bs-toggle="offcanvas">Close
                </button>
            </div>
        </div>
    </div>
</div>
<!-- modal end -->
<!-- confirm delete pokemon modal -->
<div class="modal fade" tabindex="-1" id="confirmDelete">
    <div class="modal-dialog modal-dialog-centered  modal-sm">
        <div class="modal-content">

            <div class="modal-body">

                <div class="text-center py-2">

                    <p class="fw-bolder fs-3 text-dark mb-0">Are you sure you want to delete this pokemon?</p>
                </div>

            </div>
            <div class="p-2">

                <div class="row g-1 g-md-2 p-1">
                    <div class="col12 col-6-md">
                        <button type="button" class="btn btn-danger w-100 text-white"
                                data-bs-dismiss="modal">Yes
                        </button>
                    </div>
                    <div class="col-12 col-6-md">
                        <button type="button" class="btn btn-outline-secondary w-100"
                                data-bs-dismiss="modal">No
                        </button>
                    </div>


                </div>
            </div>
        </div>
    </div>
</div>
<!-- modal end -->
<!-- confirm Mega Evolve pokemon modal -->
<div class="modal fade" tabindex="-1" id="confirmMega">
    <div class="modal-dialog modal-dialog-centered  modal-sm">
        <div class="modal-content">

            <div class="modal-body p-2">

                <div class="text-center py-2">

                    <p class="fw-bolder fs-3 text-dark mb-0">Are you sure you want to Mega Evolve this pokemon?</p>
                </div>

            </div>
            <div class="p-2">

                <div class="row g-1 g-md-2 p-1">
                    <div class="col12 col-6-md">
                        <button type="button" class="btn btn-success w-100 text-white"
                                data-bs-dismiss="modal">Yes
                        </button>
                    </div>
                    <div class="col-12 col-6-md">
                        <button type="button" class="btn btn-outline-secondary w-100"
                                data-bs-dismiss="modal">No
                        </button>
                    </div>


                </div>
            </div>
        </div>
    </div>
</div>
