                            </div>

                                    alt="pokemonImg">

                            </div>
                            <div class="col-4 text-center ">
                                <img class=" img-fluid border rounded w-100"
                                    src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/132.png"
                                    alt="pokemonImg">

                            </div>
                            <div class="col-4 text-center ">
                                <img class="img-fluid border rounded w-100"
                                    src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/132.png"
                                    alt="pokemonImg">
                            </div>



                        </div>
                    </div>
                    <div class="card-body pt-2 pb-3 ">
                        <div class="text-center">
                            <p class="text-uppercase fw-bold text-secondary fs-6 mt-2 mb-1">Raid Power</p>

                            <!-- editTeamOffCanvas -->
                            <!-- PokemonDetailsOffCanvas -->
                        </div>
                    </div>
                </div>
                <!-- img end -->

            </div>


        </div>

    </div>

    <!-- Offcanvas Start -->
    <div class="offcanvas offcanvas-end " tabindex="-1" id="editTeamOffCanvas">
        <div class="offcanvas-header bg-primary text-center text-white">
            <h5 class="offcanvas-title" id="editTeamOffCanvasLabel">Edit Team</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>

        <div class="">
            <!-- Pokemon horitzonal card -->
            <div class="border-bottom rounded-0 w-100">

                <div class="row g-0">
                    <div class="col-3">
                        <img class="img-fluid horz-card-img"
                            src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/132.png"
                            alt="pokemonImg">
                    </div>
                    <div class="col-6">
                        <div class="p-1 ms-1">
                            <p class="fs-5 mb-0">Ditto</p>
                            <div class="d-flex mt-0">
                                <p class="me-2 fs-6 mb-0">CP: xxxx</p>
                                <p class="fs-6 mb-0">RP: xxx</p>

                            </div>

                        </div>
                    </div>
                    <div class="col-3">
                        <div class="d-flex justify-content-center align-items-center h-100">
                            <i type="button" class="bi bi-arrow-repeat me-2  fs-4 text-black "></i>
                            <i type="button" data-bs-toggle="modal" data-bs-target="#confirmDelete"
                                class="bi bi-trash-fill fs-5 text-danger "></i>
                        </div>
                    </div>
                </div>



            </div>
            <!-- Pokemon horitzonal card -->
            <!-- Pokemon horitzonal card -->
            <div class="border-bottom rounded-0 w-100">

                <div class="row g-0">
                    <div class="col-3">
                        <img class="img-fluid horz-card-img"
                            src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/132.png"
                            alt="pokemonImg">
                    </div>
                    <div class="col-6">
                        <div class="p-1 ms-1">
                            <p class="fs-5 mb-0">Ditto</p>
                            <div class="d-flex mt-0">
                                <p class="me-2 fs-6 mb-0">CP: xxxx</p>
                                <p class="fs-6 mb-0">RP: xxx</p>

                            </div>

                        </div>
                    </div>
                    <div class="col-3">
                        <div class="d-flex justify-content-center align-items-center h-100">
                            <i class="bi bi-arrow-repeat me-2  fs-4 text-black "></i>
                            <i class="bi bi-trash-fill fs-5 text-danger "></i>
                        </div>
                    </div>
                </div>



            </div>
            <!-- Pokemon horitzonal card -->
            <!-- Pokemon horitzonal card -->
            <div class="border-bottom rounded-0 w-100">

                <div class="row g-0">
                    <div class="col-3">
                        <img class="img-fluid horz-card-img"
                            src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/132.png"
                            alt="pokemonImg">
                    </div>
                    <div class="col-6">
                        <div class="p-1 ms-1">
                            <p class="fs-5 mb-0">Ditto</p>
                            <div class="d-flex mt-0">
                                <p class="me-2 fs-6 mb-0">CP: xxxx</p>
                                <p class="fs-6 mb-0">RP: xxx</p>

                            </div>

                        </div>
                    </div>
                    <div class="col-3">
                        <div class="d-flex justify-content-center align-items-center h-100">
                            <i class="bi bi-arrow-repeat me-2  fs-4 text-black "></i>
                            <i class="bi bi-trash-fill fs-5 text-danger "></i>
                        </div>
                    </div>
                </div>



            </div>
            <!-- Pokemon horitzonal card -->
            <!-- Add new Pokemon horitzonal card -->
            <div class="p-2">
                <button data-bs-toggle="offcanvas" data-bs-target="#addPokemonOffcanvas"
                    class="btn btn-primary w-100 fs-4 w-100">
                    Add Pokemon </button>
            </div>
            <!-- Pokemon horitzonal card -->
        </div>


    </div>
    <!-- Offcanvas End -->

    <!-- Add Pokemon Offcanvas   -->
    <div class="offcanvas offcanvas-end " tabindex="-1" id="addPokemonOffcanvas">
        <div class="offcanvas-header bg-primary text-center text-white">
            <h5 class="offcanvas-title">Add Pokemon</h5>
            <button type="button" class="btn-close" data-bs-toggle="offcanvas" data-bs-target="#editTeamOffCanvas"
                aria-label="back"></button>
        </div>
        <div class="">
            <div class="p-3 border-bottom">
                <label class="form-label w-100">Search Pokemon
                    <input class="form-control " placeholder="'Enter' to Search" id="pokemonSelect">

                </label>
            </div>
            <div id="renderList">

            </div>
        </div>


    </div>
    <!-- add pokemon offcanvas end -->
    <!-- added pokemon details offcanvas -->
    <div class="offcanvas offcanvas-end d-flex flex-column" tabindex="-1" id="addPokemonDetailsOffCanvas">
        <div class="offcanvas-header bg-primary text-center text-white">
            <h5 class="offcanvas-title">Pokemon Details</h5>
            <button type="button" class="btn-close" data-bs-toggle="offcanvas" data-bs-target="#addPokemonOffcanvas"
                aria-label="back"></button>
        </div>
        <div class="flex-grow-1 d-flex flex-column">
            <div class="px-4">
                <div class="px-5 pt-3">
                    <img src="" class="img-fluid details-img w-100 border rounded" alt="">
                </div>
            </div>
            <div class="text-center">
                <p class="fs-4 fw-medium mt-2 details-name text-capitalize"></p>
            </div>
            <form class="container-fluid d-flex flex-column flex-grow-1">
                <!-- cp button div -->
                <div class="row g-2 btn-group" role="group" aria-label="Pokemon Creature Power Buttons">
                    <div class="col-6">
                        <input type="radio" class="btn-check " id="tierOneCP" name="btnradio" autocomplete="off">
                        <label class="btn btn-outline-primary w-100 " for="tierOneCP">0-1500CP</label>

                    </div>
                    <div class="col-6">
                        <input type="radio" class="btn-check" id="tierTwoCP" name="btnradio" autocomplete="off">
                        <label class="btn btn-outline-primary w-100" for="tierTwoCP">2500+CP</label>

                    </div>
                    <div class="col-6">
                        <input type="radio" class="btn-check" id="tierThreeCP" name="btnradio" autocomplete="off">
                        <label class="btn btn-outline-primary w-100" for="tierThreeCP">2500-3500CP</label>

                    </div>
                    <div class="col-6">
                        <input type="radio" class="btn-check" id="tierFourCP" name="btnradio" autocomplete="off">
                        <label class="btn btn-outline-primary w-100" for="tierFourCP">3500+CP</label>

                    </div>
                </div>
                <!-- end -->
                <!-- toggle options -->
                <div class="row g-2 m-2">
                    <div class="">
                        <label class="form-check-label">

                            <input type="checkbox" id="isShadow" class="form-check-input">
                            Shadow
                        </label>

                    </div>
                    <div class="">
                        <label class="form-check-label">

                            <input type="checkbox" id="isMega" class="form-check-input">
                            Mega Evolved
                        </label>
                    </div>
                </div>
                <!-- end -->
                <!-- submit button -->
                <div class="row g-2 mt-auto">
                    <div class="col-12">
                        <button type="button" data-bs-toggle="modal" data-bs-target="#pokemonAddedSuccess" href="#"
                            class="btn btn-primary mb-2 py-2 fs-4 w-100">Add Pokemon</button>
                    </div>
                </div>
                <!-- end -->
            </form>
        </div>
    </div>
    <!-- added pokemon details offcanvas end -->
    <!-- success added pokemon modal -->
    <div class="modal fade" tabindex="-1" id="pokemonAddedSuccess">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-header p-3">
                    <h1 class="modal-title fs-5 text-center mx-auto" id="pokemonAddedSuccessTitle">Pokemon Added</h1>
                    <!-- <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button> -->
                </div>
                <div class="modal-body">
                    <!-- img -->
                    <div class="row justify-content-center">
                        <div class="col-10">
                            <img class="img-fluid w-100 border rounded"
                                src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/351.png"
                                alt="">
                        </div>
                    </div>
                    <!-- RP text -->
                    <div class="text-center">
                        <p class="text-uppercase fw-bold text-secondary fs-6 mt-2 mb-1">Raid Power</p>
                        <p class="fw-bolder fs-3 text-dark mb-0">318</p>
                    </div>

                </div>
                <div class="modal-footer p-2">
                    <button type="button" class="btn btn-secondary w-100" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <!-- modal end -->
    <!-- confirm delete pokemon modal -->
    <div class="modal fade" tabindex="-1" id="confirmDelete">
        <div class="modal-dialog modal-dialog-centered  modal-sm">
            <div class="modal-content">

                <div class="modal-body">

                    <div class="text-center py-2">

                        <p class="fw-bolder fs-3 text-dark mb-0">Are you sure you want to delete this pokemon?</p>
                    </div>

                </div>
                <div class="p-2">

                    <div class="row g-1 g-md-2 p-1">
                        <div class="col12 col-6-md">
                            <button type="button" class="btn btn-danger w-100 text-white"
                                data-bs-dismiss="modal">Yes</button>
                        </div>
                        <div class="col-12 col-6-md">
                            <button type="button" class="btn btn-outline-secondary w-100"
                                data-bs-dismiss="modal">No</button>
                        </div>


                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- modal end -->
