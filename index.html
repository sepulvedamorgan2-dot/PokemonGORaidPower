<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Raid Power Calculator</title>


    <link rel="stylesheet" href="./styles/css/app.css">
    <link rel="stylesheet" href="./styles/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./styles/css/typecolor.css">
</head>


<body class="bg-light">
<div id="app2">
    <navbar-main page-title="Raid Teams"> </navbar-main>


    <!-- Type Selector -->
    <div class="container-fluid  d-sm-none ">
        <div class="row mt-2">

            <label class="slimm">Pokemon Type
                <select class="form-select" id="mobileTypeSelector">
                    <option value="normal">Normal</option>
                    <option value="fire">Fire</option>
                    <option value="water">Water</option>
                    <option value="electric">Electric</option>
                    <option value="grass">Grass</option>
                    <option value="ice">Ice</option>
                    <option value="fighting">Fighting</option>
                    <option value="poison">Poison</option>
                    <option value="ground">Ground</option>
                    <option value="flying">Flying</option>
                    <option value="psychic">Psychic</option>
                    <option value="bug">Bug</option>
                    <option value="rock">Rock</option>
                    <option value="ghost">Ghost</option>
                    <option value="dragon">Dragon</option>
                    <option value="dark">Dark</option>
                    <option value="steel">Steel</option>
                </select>
            </label>

        </div>

    </div>
    <!-- Type selectore ENd -->
    <!-- Card  -->
    <raid-team-card-container :pokemon-list="pokemonList" :pokemon-team-list="pokemonTeamList">
    </raid-team-card-container>
    <!-- Card End -->


</div>
<!-- modal end -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script type="module">
    // create the app
    import app from './AppRaidTeams.js';

    // tell it to run on the div #app
    app.mount('#app2');
</script>

<script src="https://unpkg.com/vue@3/dist/vue.esm-browser.js "></script>


</body>


</html>
