<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Raid Power Calculator</title>
    <link rel="stylesheet" href="./styles/css/app.css">
    <link rel="stylesheet" href="./styles/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./styles/css/typecolor.css">
</head>

<body class="bg-light">


<div id="app">
    <!--    Navbar-->
    <navbar-main page-title="Raid Power"></navbar-main>
    <!--    Navbar End-->

    <!--    Search Bar Div-->
    <search-bar-container class="mt-3"
                          title="Search Pokemon"
                          have-extra-button="true"
                          place-holder="Ex: Charizard"
                          have-filter=true
                          @search-query="searchForPokemon = $event"
                          filter-toggle="offcanvas"
                          filter-toggle-id="#filterPokemonOffCanvas"
    >
        <!--        add pokemon Button-->
        <div class="btn btn-primary w-100 " type="button" data-bs-toggle="offcanvas"
             data-bs-target="#addPokemonOffcanvas">

            <i class=" d-md-block">Add Pokemon</i>
        </div>

    </search-bar-container>
    <!-- Search Bar End -->

    <!--    Pokemon List-->
    <pokelist-container :searched-and-filtered-array="matches" :full-pokemon-list="pokemonList"
                        @clicked-pokemon="getClickedObject"></pokelist-container>
    <!--pokemon List end-->

    <!--View Pokemon Details Offcanvas-->
    <off-canvas-container id="pokemonDetailsOffCanvas" title="Pokemon Details">
        <details-off-canvas :active-item="activeItem"></details-off-canvas>
    </off-canvas-container>
    <!--    View pokemon Details end-->

    <!-- Filter pokemon offcanvas -->
    <off-canvas-container id="filterPokemonOffCanvas" title="Filter Pokemon">
        <filter-off-canvas :each-pokemon="pokemonList" :search-for-pokemon="searchForPokemon"
                           @matched-pokemon="updateMatches"></filter-off-canvas>
    </off-canvas-container>


    <!-- added pokemon details offcanvas end -->

    <!-- edit pokemon offcanvas -->
    <off-canvas-container id="editPokemonOffCanvas" title="Edit Pokemon" back-arrow-id="#pokemonDetailsOffCanvas">
        <add-edit-off-canvas :active-item="activeItem" @add-pokemon="addPokemon"></add-edit-off-canvas>
    </off-canvas-container>
    <!-- added pokemon details offcanvas end -->

    <!-- Add Pokemon Offcanvas   -->
    <off-canvas-container id="addPokemonOffcanvas" title="Add Pokemon">


        <div class="">
            <div class="p-2 mt-2 border-bottom">
                <search-bar-container @search-query="searchAllPokemons" title="Search Pokemon"></search-bar-container>

            </div>
            <div v-for="pokemonResult in searchResults">
                <div class="border-bottom rounded-0 w-100" aria-label="${pokemon}">
                    <div class="row g-0 align-items-center">
                        <div class="col-3">
                            <img class="img-fluid horz-card-img " :src="getSpriteLink(pokemonResult.pokemonId)"
                                 alt="pokemonImg">
                        </div>
                        <div class="col-6">
                            <div class="ms-0 ms-sm-0">
                                <p class="fs-5 mb-0 text-capitalize">{{ pokemonResult.name }}</p>

                            </div>
                        </div>
                        <div class="col-3">
                            <div class="p-1">
                                <button class="btn btn-sm btn-primary w-100 searchedPokemonBtn"
                                        data-bs-toggle="offcanvas" data-bs-target="#addPokemonDetailsOffcanvas"
                                        v-on:click="getClickedObject(pokemonResult)">Select
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </off-canvas-container>
    <!-- add pokemon offcanvas end -->
    <off-canvas-container id="addPokemonDetailsOffcanvas" title="Add Pokemon" back-arrow-id="#addPokemonOffcanvas">
        <add-edit-off-canvas :active-item="activeItem" :is-new=true @add-pokemon="addPokemon"
                             @quantity="updateQty"></add-edit-off-canvas>
    </off-canvas-container>
    <!-- added pokemon details offcanvas end -->
    <!-- success added pokemon modal -->
    <div class="modal fade" tabindex="-1" id="pokemonAddedSuccess" v-if="activeItem">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-header p-3">
                    <h1 class="modal-title fs-5 text-center mx-auto" id="pokemonAddedSuccessTitle">Added {{ qty }}
                        {{ activeItem.name }}</h1>
                    <!-- <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button> -->
                </div>
                <div class="modal-body">
                    <!-- img -->
                    <div class="row justify-content-center">
                        <div class="col-10">
                            <img class="img-fluid w-100 border rounded"
                                 :src="getSpriteLink(activeItem.pokemonId)"
                                 :alt="activeItem.name">
                        </div>
                    </div>
                    <!-- RP text -->
                    <div class="text-center">
                        <p class="text-uppercase fw-bold text-tertiary fs-6 mt-2 mb-1">Raid Power</p>
                        <p class="fw-bolder fs-3 text-dark mb-0">{{ activeItem.cp }}</p>
                    </div>

                </div>
                <div class="modal-footer p-2">
                    <button type="button" class="btn btn-primary w-100" data-bs-dismiss="modal"
                            data-bs-toggle="offcanvas" v-on:click="qty = 1">Close
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- modal end -->
    <!-- confirm delete pokemon modal -->
    <div class="modal fade" tabindex="-1" id="confirmDelete">
        <div class="modal-dialog modal-dialog-centered  modal-sm">
            <div class="modal-content">

                <div class="modal-body">

                    <div class="text-center py-2">

                        <p class="fw-bolder fs-3 text-dark mb-0">Are you sure you want to delete this Pokemon?</p>
                    </div>

                </div>
                <div class="p-2">

                    <div class="row g-1 g-md-2 p-1">
                        <div class="col12 col-6-md">
                            <button type="button" class="btn btn-danger w-100 text-white" v-on:click="deletePokemon()"
                                    data-bs-dismiss="modal" data-bs-toggle="offcanvas">
                                Yes
                            </button>
                        </div>
                        <div class="col-12 col-6-md">
                            <button type="button" class="btn btn-outline-secondary w-100"
                                    data-bs-dismiss="modal">No
                            </button>
                        </div>


                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- modal end -->
    <!-- confirm Mega Evolve pokemon modal -->
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script type="module">
    // create the app
    import app from './App.js';

    // tell it to run on the div #app
    app.mount('#app');
</script>

<script src="https://unpkg.com/vue@3/dist/vue.esm-browser.js "></script>

</body>


</html>
