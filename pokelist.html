<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Raid Power Calculator</title>
    <link rel="stylesheet" href="./styles/css/app.css">
    <link rel="stylesheet" href="./styles/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./styles/css/typecolor.css">
</head>

<body class="bg-light">


<div id="app">
    <!--    Navbar-->
    <navbar-main page-title="Raid Power"></navbar-main>
    <!--    Navbar End-->
    <add-pokemon-off-canvas  @add-pokemon="addPokemon"  :filter=false  :pokemon-list-from-api="pokemonListAPI" array-length=5 :card-style=1 > </add-pokemon-off-canvas>
    <!--    Search Bar Div-->
    <search-bar-container class="mt-3"
                          title="Search Pokemon"

                          place-holder="Ex: Charizard"
                          :filter-off-canvas=true
                          :filter-off-canvas-list="pokemonList"
                          @search-query="searchForPokemon = $event"

                          @search-results="matchedPokemon => matches = matchedPokemon"

    >
        <!--        add pokemon Button-->


    </search-bar-container>
    <!-- Search Bar End -->

    <!--    Pokemon List-->
    <pokelist-container :searched-and-filtered-array="matches" :full-pokemon-list="pokemonList"
                        ref="pokelistContainer" @delete-item="deletePokemon"></pokelist-container>
    <!--pokemon List end-->






</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script type="module">
    // create the app
    import app from './App.js';

    // tell it to run on the div #app
    app.mount('#app');
</script>

<script src="https://unpkg.com/vue@3/dist/vue.esm-browser.js "></script>

</body>


</html>
